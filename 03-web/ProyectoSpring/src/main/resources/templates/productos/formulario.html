<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${titulo} + ' | DulceByte'"></title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            Dulce<span>Byte</span>
        </div>

        <nav class="menu">

            <a th:href="@{/}">
                <span>🏠</span>
                <span class="text">Inicio</span>
            </a>

            <a th:href="@{/productos}" class="active">
                <span>🧁</span>
                <span class="text">Productos</span>
            </a>

            <a th:href="@{/categorias}">
                <span>🗂️</span>
                <span class="text">Categorías</span>
            </a>

            <a th:href="@{/pedidos}">
                <span>📦</span>
                <span class="text">Pedidos</span>
            </a>

        </nav>

    </aside>

    <main class="main">

        <div class="page-header">
            <h2 th:text="${titulo}"></h2>
        </div>

        <div class="card">

            <form
                class="form-grid"
                th:object="${producto}"
                th:action="${idProducto != null}
                    ? @{/productos/actualizar/{id}(id=${idProducto})}
                    : @{/productos/guardar}"
                method="post">

                <div class="form-group">
                    <label>Nombre</label>

                    <input
                        type="text"
                        th:field="*{nombre}"
                        placeholder="Nombre del producto">

                    <span th:errors="*{nombre}"></span>
                </div>

                <div class="form-group">
                    <label>Descripción</label>

                    <textarea
                        th:field="*{descripcion}"
                        placeholder="Descripción del producto">
                    </textarea>
                </div>

                <div class="form-group">
                    <label>Precio</label>

                    <input
                        type="number"
                        step="0.01"
                        th:field="*{precio}">

                    <span th:errors="*{precio}"></span>
                </div>

                <div class="form-group">
                    <label>Categoría</label>

                    <select th:field="*{idCategoria}">

                        <option value="">
                            Seleccione una categoría
                        </option>

                        <option
                            th:each="categoria : ${categorias}"
                            th:value="${categoria.idCategoria}"
                            th:text="${categoria.nombre}">
                        </option>

                    </select>

                    <span th:errors="*{idCategoria}"></span>
                </div>

                <div class="form-group">
                    <label>Disponibilidad</label>

                    <select th:field="*{disponible}">
                        <option value="true">Disponible</option>
                        <option value="false">No disponible</option>
                    </select>
                </div>

                <div class="form-actions">

                    <button
                        class="btn btn-primary"
                        type="submit">
                        Guardar
                    </button>

                    <a
                        class="btn btn-secondary"
                        th:href="@{/productos}">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
