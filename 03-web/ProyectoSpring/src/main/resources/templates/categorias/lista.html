<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías | DulceByte</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="brand">Dulce<span>Byte</span></div>

        <nav class="menu">
            <a th:href="@{/}">
                <span>🏠</span><span class="text">Inicio</span>
            </a>
            <a th:href="@{/productos}">
                <span>🧁</span><span class="text">Productos</span>
            </a>
            <a th:href="@{/categorias}" class="active">
                <span>🗂️</span><span class="text">Categorías</span>
            </a>
            <a th:href="@{/pedidos}">
                <span>📦</span><span class="text">Pedidos</span>
            </a>
        </nav>
    </aside>

    <main class="main">

        <div class="page-header">
            <h2>Categorías</h2>
            <a class="btn btn-primary" th:href="@{/categorias/nueva}">+ Nueva categoría</a>
        </div>

        <div th:if="${mensaje}" class="message message-success" th:text="${mensaje}"></div>

        <div class="card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="categoria : ${categorias}">
                            <td th:text="${categoria.nombre}"></td>
                            <td th:text="${categoria.descripcion}"></td>
                            <td>
                                <a class="btn btn-secondary"
                                   th:href="@{/categorias/editar/{id}(id=${categoria.idCategoria})}">
                                   Editar
                                </a>
                                <a class="btn btn-dark"
                                   th:href="@{/categorias/eliminar/{id}(id=${categoria.idCategoria})}"
                                   onclick="return confirm('¿Deseas eliminar esta categoría?')">
                                   Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

</div>

</body>
</html>
