<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${titulo} + ' | DulceByte'"></title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            Dulce<span>Byte</span>
        </div>

        <nav class="menu">

            <a th:href="@{/}">
                <span>🏠</span>
                <span class="text">Inicio</span>
            </a>

            <a th:href="@{/productos}">
                <span>🧁</span>
                <span class="text">Productos</span>
            </a>

            <a th:href="@{/categorias}" class="active">
                <span>🗂️</span>
                <span class="text">Categorías</span>
            </a>

            <a th:href="@{/pedidos}">
                <span>📦</span>
                <span class="text">Pedidos</span>
            </a>

        </nav>

    </aside>

    <main class="main">

        <div class="page-header">
            <h2 th:text="${titulo}"></h2>
        </div>

        <div class="card">

            <form
                class="form-grid"
                th:object="${categoria}"
                th:action="${idCategoria != null}
                    ? @{/categorias/actualizar/{id}(id=${idCategoria})}
                    : @{/categorias/guardar}"
                method="post">

                <div class="form-group">

                    <label>Nombre</label>

                    <input
                        type="text"
                        th:field="*{nombre}"
                        placeholder="Nombre de la categoría">

                    <span th:errors="*{nombre}"></span>

                </div>

                <div class="form-group">

                    <label>Descripción</label>

                    <textarea
                        th:field="*{descripcion}"
                        placeholder="Descripción de la categoría">
                    </textarea>

                </div>

                <div class="form-actions">

                    <button
                        class="btn btn-primary"
                        type="submit">
                        Guardar
                    </button>

                    <a
                        class="btn btn-secondary"
                        th:href="@{/categorias}">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
